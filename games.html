<!DOCTYPE html>
<html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games Room - YAARBAZI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f0f1a;color:#fff;padding:16px}
a{color:#ffd700;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center}
.card{background:#1c1c2e;border:1px solid #333;border-radius:16px;padding:16px;margin-top:14px}
h2{margin:0 0 8px}.btn{background:#ffd700;color:#000;border:0;padding:12px 16px;border-radius:12px;font-weight:800;width:100%;margin-top:10px;font-size:16px}
.dice{font-size:64px;text-align:center}.opt{background:#2a2a44;padding:12px;border-radius:10px;margin-top:8px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff}
</style></head><body>
<div class="top"><a href="index.html">⬅ Back</a><b>🎮 GAMES ROOM</b><span>🪙 1250</span></div>

<div class="card"><h2>🎲 Ludo Dice</h2><div class="dice" id="dice">🎲</div><p id="diceTxt" style="text-align:center">Dice Phekho!</p><button class="btn" onclick="roll()">DICE PHEKO</button></div>

<div class="card"><h2>😈 Truth & Dare</h2><p id="tdTxt">Koi Ek Dabao...</p><button class="btn" onclick="truth()">TRUTH</button><button class="btn" style="background:#ff4d6d;color:#fff" onclick="dare()">DARE</button></div>

<div class="card"><h2>🧠 Quiz - Yaar Ka Test</h2><p><b>Atiq Ka Favourite Kya Hai?</b></p><div class="opt" onclick="quiz(this,1)">A) Chai ☕</div><div class="opt" onclick="quiz(this,0)">B) Coffee</div><div class="opt" onclick="quiz(this,0)">C) Juice</div><p id="quizAns"></p></div>

<div class="card"><h2>🎤 Voice Party</h2><p>9 Mic Wala Live Room - Sab Baat Kar Sakte Hain</p><a href="voice.html"><button class="btn" style="background:#7b61ff;color:#fff">VOICE ROOM KHOLO →</button></a></div>

<script>
function roll(){let n=Math.floor(Math.random()*6)+1;let d=["⚀","⚁","⚂","⚃","⚄","⚅"];document.getElementById("dice").innerText=d[n-1];document.getElementById("diceTxt").innerText="Aaya Hai: "+n+" !";}
let truths=["Apna Crush Ka Naam Batao? 😍","Last Baar Kab Roye The?","Sab Se Bara Jhoot Kya Bola?","Kisi Ko Stalk Karte Ho? 👀"];
let dares=["Agle 5 Min Tak Urdu Me Baat Karo!","Apni Gallery Ki Last Photo Dikhao!","Gana Gaa Ke Sunao! 🎤","Kisi Dost Ko I Love You Bolo!"];
function truth(){document.getElementById("tdTxt").innerText="TRUTH: "+truths[Math.floor(Math.random()*truths.length)];}
function dare(){document.getElementById("tdTxt").innerText="DARE: "+dares[Math.floor(Math.random()*dares.length)];}
function quiz(el,ok){document.getElementById("quizAns").innerText=ok?"✅ SAHI JAWAB! Tu Pakka Yaar Hai!":"❌ Galat! Dobara Try Kar";el.style.background=ok?"#1a7a3a":"#7a1a1a";}
</script></body></html>
