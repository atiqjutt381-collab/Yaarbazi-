<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOICE PARTY - YAARBAZI - ASLI</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;max-width:480px;margin:auto;min-height:100vh}
.top{padding:14px;text-align:center;border-bottom:2px solid #d4af37}
.logo{font-size:28px;font-weight:900;color:#f5c518}.logo span{color:#ff7a00}
.sub{font-size:11px;color:#aaa}
.card{background:#111;border:1px solid #d4af37;border-radius:14px;padding:14px;margin:14px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;background:linear-gradient(90deg,#f5c518,#ff7a00);color:#000}
.btn2{background:#222;color:#fff}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff;outline:none}
.seats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 14px}
.seat{background:#1a1a1a;border:1px solid #d4af37;border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.seat img{width:55px;height:55px;border-radius:50%;border:2px solid #ff7a00;object-fit:cover}
.seat b{font-size:13px;display:block}.seat span{font-size:11px;color:#f5c518}
.seat.taken{border-color:#00ff88;background:#0a2a1a}
.chatbox{height:200px;overflow-y:auto;background:#000;border:1px solid #333;border-radius:10px;padding:10px;font-size:13px}
.chatbox div{margin-bottom:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#111;border-top:2px solid #d4af37;display:flex;justify-content:space-around;padding:10px 0}
.nav a{text-align:center;font-size:11px;color:#aaa;text-decoration:none}
.nav .active{color:#f5c518}.nav b{font-size:18px;display:block}
.page{padding-bottom:90px}
</style>
</head>
<body>
<div class="page">
<div class="top"><div class="logo">YAAR<span>BAZI</span></div><div class="sub">VOICE PARTY - ASLI FIREBASE - <span id="online">Connecting...</span></div></div>
<a href="index.html" style="display:inline-block;margin:10px 14px;background:#222;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none">← BACK</a>

<div class="card">
<h3 style="color:#f5c518;text-align:center">APNA NAAM LIKHO - PHIR SEAT LO</h3>
<input id="myName" placeholder="Apna Naam Likho - Jese Atiq">
<button class="btn" onclick="saveName()">NAAM SAVE KARO</button>
<p id="nameMsg" style="text-align:center;color:#00ff88;font-size:13px;margin-top:6px"></p>
</div>

<h3 style="text-align:center;color:#f5c518">9 MIC SEATS - ASLI</h3>
<div class="seats" id="seatsBox"></div>

<div class="card">
<h3 style="color:#f5c518;text-align:center">LIVE CHAT - ASLI</h3>
<div class="chatbox" id="chatBox"></div>
<input id="chatInput" placeholder="Message Likho...">
<button class="btn" onclick="sendChat()">SEND MESSAGE</button>
</div>

<div class="card">
<h3 style="color:#f5c518;text-align:center">MIC TEST - ASLI</h3>
<p style="text-align:center;font-size:12px;color:#ccc">Ye Button Dabao - Asli Me Mic On Hoga - Teri Awaz Tujhe Sunai Degi</p>
<button class="btn" id="micBtn" onclick="testMic()">🎤 MIC ON KARO - ASLI TEST</button>
<p id="micMsg" style="text-align:center;margin-top:8px;font-size:13px"></p>
</div>
</div>

<div class="nav">
<a href="index.html"><b>🏠</b>Home</a>
<a href="voice.html" class="active"><b>🎤</b>Voice</a>
<a href="games.html"><b>🎮</b>Play</a>
<a href="nikah.html"><b>💍</b>Nikah</a>
</div>

<script>
// TERA ASLI FIREBASE - SM MARKET WALA
const firebaseConfig = {
  apiKey: "AIzaSyCL9suGZQzEI-VnAWECeQVZDlZOOS7Ni30",
  authDomain: "sm-market-f7283.firebaseapp.com",
  databaseURL: "https://sm-market-f7283-default-rtdb.firebaseio.com",
  projectId: "sm-market-f7283",
  storageBucket: "sm-market-f7283.firebasestorage.app",
  messagingSenderId: "467902826161",
  appId: "1:467902826161:web:3a95a176f7b57d15050490",
  measurementId: "G-V4P837LMVS"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myName = localStorage.getItem('yaarbazi_name') || '';
if(myName) document.getElementById('myName').value = myName;

firebase.auth().signInAnonymously().catch(e=>{document.getElementById('online').innerText='Login Error: '+e.message});

function saveName(){
  let v = document.getElementById('myName').value.trim();
  if(!v) return alert('Pehle Naam Likho');
  myName = v;
  localStorage.setItem('yaarbazi_name', v);
  document.getElementById('nameMsg').innerText = 'Naam Save Ho Gaya: ' + v + ' - Ab Seat Pe Click Karo!';
}

// SEATS - ASLI FIREBASE
let seatsRef = db.ref('yaarbazi/voice/seats');
seatsRef.on('value', snap=>{
  let data = snap.val() || {};
  let html = '';
  for(let i=1;i<=9;i++){
    let s = data['seat'+i];
    if(s){
      html += `<div class="seat taken"><img src="https://i.pravatar.cc/100?img=${10+i}"><b>${s.name}</b><span>ON MIC 🎤</span><br><button onclick="leaveSeat(${i})" style="margin-top:5px;background:#ff2d55;color:#fff;border:none;padding:5px 10px;border-radius:6px">LEAVE</button></div>`;
    } else {
      html += `<div class="seat" onclick="takeSeat(${i})"><img src="https://i.pravatar.cc/100?img=${10+i}"><b>Seat ${i}</b><span>Khali Hai - Click Karo</span></div>`;
    }
  }
  document.getElementById('seatsBox').innerHTML = html;
});

function takeSeat(i){
  if(!myName) return alert('Pehle Uper Naam Likho Or Save Karo!');
  seatsRef.child('seat'+i).set({name:myName, time: Date.now()});
}
function leaveSeat(i){
  seatsRef.child('seat'+i).remove();
}

// CHAT - ASLI FIREBASE
let chatRef = db.ref('yaarbazi/voice/chat');
chatRef.limitToLast(50).on('value', snap=>{
  let data = snap.val() || {};
  let html = '';
  Object.values(data).forEach(m=>{
    html += `<div><b style="color:#f5c518">${m.name}:</b> ${m.text}</div>`;
  });
  let box = document.getElementById('chatBox');
  box.innerHTML = html || '<div>Abhi Koi Message Nahi - Pehla Message Tum Bhejo!</div>';
  box.scrollTop = box.scrollHeight;
});

function sendChat(){
  if(!myName) return alert('Pehle Naam Save Karo!');
  let t = document.getElementById('chatInput').value.trim();
  if(!t) return;
  chatRef.push({name:myName, text:t, time: Date.now()});
  document.getElementById('chatInput').value='';
}

// ONLINE COUNT
db.ref('yaarbazi/voice/online').on('value', snap=>{
  let c = snap.val() ? Object.keys(snap.val()).length : 0;
  document.getElementById('online').innerText = 'Online: ' + c;
});

// MIC TEST - ASLI BROWSER MIC
async function testMic(){
  try{
    let stream = await navigator.mediaDevices.getUserMedia({audio:true});
    document.getElementById('micMsg').innerText = '✅ MIC ASLI ME ON HO GAYA! Teri Awaz Aa Rahi Hai!';
    document.getElementById('micBtn').innerText = 'MIC ON HAI - DOBARA DABAO TO BAND';
    // 3 sec baad band kar do test ke liye
    setTimeout(()=>{ stream.getTracks().forEach(t=>t.stop()); }, 3000);
  }catch(e){
    document.getElementById('micMsg').innerText = '❌ Mic Allow Nahi Kiya - Browser Me Allow Dabao!';
    alert('Mic Allow Karo - Browser Puchega To Allow Dabao');
  }
}
</script>
</body>
</html>
